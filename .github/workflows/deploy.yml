name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - 'weeding_planner_landing_page/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './weeding_planner_landing_page'
      - id: deployment
        uses: actions/deploy-pages@v4
